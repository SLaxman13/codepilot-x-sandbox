  name: CodePilot-X Ephemeral Sandbox

on:
  repository_dispatch:
    types: [run-patch-test]
  push:
    branches: [ main ]

jobs:
  test-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Write Patch File
        run: |
          PATCH_CONTENT="${{ github.event.client_payload.patch }}"
          if [ -z "$PATCH_CONTENT" ]; then
            echo "No patch payload provided (Push Event)." > changes.patch
          else
            printf "%b" "$PATCH_CONTENT" > changes.patch
          fi

      - name: Apply AI Generated Patch
        continue-on-error: true
        run: |
          git apply --whitespace=fix changes.patch || patch -p1 --fuzz=3 < changes.patch || true

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Test Suite
        id: run_tests
        continue-on-error: true
        run: |
          pip install pytest pytest-json-report
          pytest --json-report --json-report-file=report.json

      - name: Post Results back to Render
        if: always()
        run: |
          CALLBACK_URL="${{ github.event.client_payload.callback_url }}"
          if [ -n "$CALLBACK_URL" ]; then
            curl -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -d @report.json || true
          else
            echo "No callback URL specified. Skipping report upload."
          fi
